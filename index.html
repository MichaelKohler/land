<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kohler.land Island</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="island/island.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="gl" aria-label="Realistic 3D island with a house per resident" aria-describedby="scene"></canvas>
    <p class="sr-only" id="scene"></p>
    <div class="veil" id="veil">
      <div><b>kohler.land</b><span>growing the island…</span></div>
    </div>
    <header>
      <div class="logo glass">kohler.land</div>
      <nav id="nav" aria-label="Residents"></nav>
      <button type="button" class="skip glass" id="sally">Say hi to Sally 🐾</button>
    </header>
    <div class="tags" id="tags" aria-hidden="true"></div>
    <div class="tags" id="ltags" aria-hidden="true"></div>
    <div class="tip glass" id="tip"></div>
    <div class="catcard glass" id="catcard" role="dialog" aria-label="Sally the cat" aria-live="polite"></div>
    <aside class="panel glass" id="panel" aria-live="polite"></aside>
    <div class="hint glass">
      Drag or Q/E to turn · right-drag or arrow keys to move · scroll or +/− to zoom<br />Double-click a spot to look at
      it · click a house or the cat
    </div>
    <div class="time glass">
      <div class="seasons" id="seasons" role="group" aria-label="Season"></div>
      <label
        ><span>Time</span><input type="range" id="time" min="0" max="24" step="0.05" aria-label="Time of day" /><output
          id="clock"
          >12:00</output
        ></label
      >
      <div class="acts">
        <button type="button" class="live" id="live" aria-pressed="true">Live</button
        ><button type="button" class="live share" id="share" title="Copy a link to this time, season and house">
          Share
        </button>
      </div>
    </div>

    <script src="island/residents.js"></script>
    <script type="module" src="island/main.js"></script>
  </body>
</html>
